name = "yomi"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

pages_build_output_dir = ".vercel/output/static"

[vars]
JWT_SECRET = "dev-secret-do-not-use-in-prod"

# Cloudflare D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "yomi-db"
database_id = "39f241c9-1be7-4dad-89c2-457e1695947f" # 请替换为真实的 Cloudflare D1 Database ID

# Cloudflare Pages specific settings
# Note: When using GitHub integration, most settings are auto-detected
# This file is primarily for local wrangler development/testing
