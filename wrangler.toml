name = "yomi"
compatibility_date = "2024-01-01"

[build]
command = "npm run build"

[site]
bucket = ".next/static"

# Cloudflare D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "yomi-db"
database_id = "YOUR_DATABASE_ID_HERE"

